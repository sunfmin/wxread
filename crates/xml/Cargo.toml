[package]
name = "wxread-xml"
description = "XML as WeChat writes it, read: a document with its stray declarations and bare ampersands, and a node's children, text and attributes by name: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The XML WeChat keeps its messages, favorites and Moments in.
roxmltree = "0.21"

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
