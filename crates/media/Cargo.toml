[package]
name = "wxread-media"
description = "What wxread file get and avatar make of the media WeChat keeps: where each kind's file lies, an image decrypted under the key derived from WeChat's kvcomm files, and a file's content type: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aes = "0.8"
md5 = "0.7"

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
