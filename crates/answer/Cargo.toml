[package]
name = "wxread-answer"
description = "What every wxread answer is written with: how many things a page holds, and a time written and read as RFC 3339: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flux-rs.workspace = true

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
