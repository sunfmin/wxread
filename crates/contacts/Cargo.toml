[package]
name = "wxread-contacts"
description = "What wxread contacts, contact and group answer of the rows they read: each contact named as WeChat shows it, found by --query, a page at a time, and a group with its notice and its members' names in it: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wxread-answer = { path = "../answer" }

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"
