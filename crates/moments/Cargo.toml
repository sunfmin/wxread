[package]
name = "wxread-moments"
description = "What wxread moments answers of the Moments WeChat has loaded: each with its author, text, location, link, media, likes and comments, newest first, a page at a time: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wxread-answer = { path = "../answer" }
wxread-media = { path = "../media" }
wxread-xml = { path = "../xml" }
# The XML WeChat keeps a Moment in.
roxmltree = "0.21"

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
