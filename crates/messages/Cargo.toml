[package]
name = "wxread-messages"
description = "What wxread messages answers of the rows it read: each message as its kind, its sender named, a page at a time: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wxread-page = { path = "../page" }
wxread-schema = { path = "../schema" }
serde_json.workspace = true
# The XML WeChat keeps every kind but text in.
roxmltree = "0.21"
# Content WeChat compressed.
ruzstd = "0.8"

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
