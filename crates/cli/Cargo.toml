[package]
name = "wxread"
description = "An agent CLI that reads WeChat for Mac 4.x directly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# One test program, tests/main.rs, not one a file.
autotests = false

[dependencies]
wxread-account = { path = "../account" }
wxread-answer = { path = "../answer" }
wxread-chats = { path = "../chats" }
wxread-contacts = { path = "../contacts" }
wxread-doctor = { path = "../doctor" }
wxread-keys = { path = "../keys" }
wxread-messages = { path = "../messages" }
wxread-schema = { path = "../schema" }
wxread-sqlcipher = { path = "../sqlcipher" }
wxread-voice = { path = "../voice" }
# WeChat's voice codec, decoded in-process (docs/adr/0005-voice-is-decoded-in-process.md).
silk = { path = "../silk" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
# WeChat's databases, decrypted, opened from memory.
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }

[dev-dependencies]
tempfile = "3"
# Content compressed as WeChat compresses it, in the synthetic accounts.
ruzstd = "0.8"

[[test]]
name = "cli"
path = "tests/main.rs"
