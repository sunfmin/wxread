[package]
name = "wxread"
description = "An agent CLI that reads WeChat for Mac 4.x directly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# One test program, tests/main.rs, not one a file.
autotests = false

[dependencies]
wxread-account = { path = "../account" }
wxread-answer = { path = "../answer" }
wxread-articles = { path = "../articles" }
wxread-chats = { path = "../chats" }
wxread-contacts = { path = "../contacts" }
wxread-doctor = { path = "../doctor" }
wxread-keys = { path = "../keys" }
wxread-crack = { path = "../crack" }
wxread-media = { path = "../media" }
wxread-messages = { path = "../messages" }
wxread-resign = { path = "../resign" }
wxread-schema = { path = "../schema" }
wxread-sqlcipher = { path = "../sqlcipher" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
libc = "0.2.191"
# The SHA-256 a written file is answered with.
sha2 = "0.10"
# WeChat's databases, decrypted, opened from memory.
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }

# Reading the running WeChat's memory is a macOS job (docs/adr/0001).
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4.3"

[dev-dependencies]
tempfile = "3"
# Content compressed as WeChat compresses it, in the synthetic accounts.
ruzstd = "0.8"
# A sticker's MD5, as its message names it.
md5 = "0.7"

[[test]]
name = "cli"
path = "tests/main.rs"
