[package]
name = "wxread-favorites"
description = "What wxread favorites answers of what the account saved (收藏): each favorite as its kind, its source named, newest first, a page at a time, and where WeChat keeps a favorite's files: pure functions, checked by Flux (docs/adr/0002-pure-crates-checked-by-flux.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wxread-answer = { path = "../answer" }
wxread-xml = { path = "../xml" }
serde_json.workspace = true
# The XML WeChat keeps a favorite in.
roxmltree = "0.21"
# The names WeChat gives a favorite's files.
md5 = "0.7"

[dev-dependencies]
proptest.workspace = true

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
